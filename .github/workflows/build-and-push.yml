name: Enterprise AI Agent CI/CD

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: enterprise-ai-agent
  ECS_CLUSTER: EnterpriseAIAgentCluster
  ECS_SERVICE: EnterpriseAIAgentService
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: enterprise-ai-agent

jobs:

  # =========================================================
  # CI
  # =========================================================

  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Python syntax check
        run: |
          python -m compileall backend frontend

      - name: Run Bandit security scan
        run: |
          bandit -r backend frontend -ll

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            -t enterprise-ai-agent:${{ github.sha }} \
            .

  # =========================================================
  # BUILD + PUSH + ECS DEPLOYMENT
  # =========================================================

  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    needs:
      - ci

    # Only master pushes can deploy production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      id-token: write

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # -----------------------------------------------------
      # AWS OIDC
      # -----------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::875243385163:role/EnterpriseAIAgentGitHubActionsRole
          aws-region: ap-southeast-2

      # -----------------------------------------------------
      # Verify AWS identity
      # -----------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # -----------------------------------------------------
      # ECR login
      # -----------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      # -----------------------------------------------------
      # Build Docker image
      # -----------------------------------------------------

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --pull \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      # -----------------------------------------------------
      # Push Docker image
      # -----------------------------------------------------

      - name: Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # -----------------------------------------------------
      # Render ECS task definition
      # -----------------------------------------------------

      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # -----------------------------------------------------
      # Deploy ECS service
      # -----------------------------------------------------

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # -----------------------------------------------------
      # Deployment summary
      # -----------------------------------------------------

      - name: Deployment successful
        run: |
          echo "=============================================="
          echo "Enterprise AI Agent deployment successful"
          echo "=============================================="
          echo "Commit: ${{ github.sha }}"
          echo "ECR: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "ECS Cluster: ${{ env.ECS_CLUSTER }}"
          echo "ECS Service: ${{ env.ECS_SERVICE }}"
          echo "=============================================="