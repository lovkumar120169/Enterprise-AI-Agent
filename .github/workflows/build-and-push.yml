name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: enterprise-ai-agent

jobs:

  # =========================================================
  # CI
  # =========================================================

  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Python syntax check
        run: |
          python -m compileall backend frontend

      - name: Run Bandit security scan
        run: |
          bandit -r backend frontend -ll

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            -t enterprise-ai-agent:${{ github.sha }} \
            .

  # =========================================================
  # PUSH TO ECR
  # =========================================================

  push-to-ecr:
    name: Push Image to ECR
    runs-on: ubuntu-latest

    needs:
      - ci

    # IMPORTANT:
    # Pull requests must NEVER push to production ECR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::875243385163:role/EnterpriseAIAgentGitHubActionsRole
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --pull \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Display image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Docker image pushed successfully:"
          echo "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"